<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<title>Seite nicht gefunden — SC Kreuz Bayreuth e.V.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700;900&family=Barlow:wght@400;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0e0e;color:#fff;font-family:'Barlow',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.code{font-family:'Oswald',system-ui,sans-serif;font-size:clamp(80px,20vw,160px);font-weight:900;line-height:1;color:#1a1a1a;letter-spacing:-4px;user-select:none}
.msg{font-family:'Oswald',system-ui,sans-serif;font-size:clamp(18px,4vw,28px);font-weight:700;margin-top:-8px;margin-bottom:14px}
.sub{font-size:14px;color:rgba(255,255,255,.45);line-height:1.7;max-width:380px;margin-bottom:36px}
.btn{display:inline-block;background:#1a5faa;color:#fff;padding:13px 30px;font-size:14px;font-weight:700;border-radius:8px;text-decoration:none;transition:.2s}
.btn:hover{background:#134d8e;transform:translateY(-2px)}
</style>
</head>
<body>
<div class="code">404</div>
<div class="msg">Seite nicht gefunden</div>
<p class="sub">Diese Seite existiert nicht oder wurde verschoben.</p>
<a href="index.html" class="btn">Zur Startseite →</a>
</body>
</html>
